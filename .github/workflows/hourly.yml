name: hourly

# Hourly jobs of the production app (payment reminders, EXM-026). Vercel Hobby only schedules
# daily jobs, so GitHub calls the protected route instead. Needs the repository secret CRON_SECRET
# (same value as in Vercel); without it, the job is skipped.
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Call the hourly route
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::notice::CRON_SECRET is not set: hourly jobs skipped."
            exit 0
          fi
          curl --fail --silent --show-error --max-time 60 \
            -H "Authorization: Bearer $CRON_SECRET" \
            https://exams.mrvin100.de/api/cron/hourly
